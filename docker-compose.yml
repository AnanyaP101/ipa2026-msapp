
services:
  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    networks:
      - app-net
    environment:
      MONGO_URI: mongodb://mongo:27017/
      DB_NAME: ipa2026_db

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-net

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: rabbitmq
    networks:
      - app-net

  scheduler:
    build: ./scheduler
    environment:
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: ipa2026_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: rabbitmq
    depends_on:
      - mongo
      - rabbitmq
    networks:
      - app-net
    restart: unless-stopped
  worker:
    build: ./worker
    environment:
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: ipa2026_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: rabbitmq
    depends_on:
      - mongo
      - rabbitmq
    networks:
      - app-net
    restart: unless-stopped
volumes:
  mongo-data:

networks:
  app-net:
